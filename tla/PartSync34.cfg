\* Same 34% adversary as PartUnsafe34 but SyncDelivery = TRUE: every vote
\* reaches both nodes (no partition), so the two nodes share one view and a
\* Byzantine rep cannot show them different final votes.
\* Expectation: CrossNodeAgreement HOLDS -- the partition was the attack vector.
SPECIFICATION Spec

CONSTANTS
    Blocks = {b1, b2}
    Quorum = 67
    Nodes = {n1, n2}
    InitBlock = b1
    NoBlock = none
    SyncDelivery = TRUE

CONSTANT Reps <- RepsW
CONSTANT Weight <- Weight34
CONSTANT Byzantine <- ByzZ

INVARIANTS
    TypeOK
    BarrierConsistent
    DecisionSound
    CrossNodeAgreement
