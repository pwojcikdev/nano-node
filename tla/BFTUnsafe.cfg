\* Same instance as BFTSafe but Byzantine weight = 2 (33.3%) = 2*Quorum - W.
\* Expectation: AtMostOneCommittable and Agreement are VIOLATED (double commit).
SPECIFICATION Spec

CONSTANTS
    Blocks = {b1, b2}
    Quorum = 4
    ByzantineActive = TRUE

CONSTANT Reps <- RepsUnit
CONSTANT Weight <- WeightUnit
CONSTANT Byzantine <- ByzTwo

INVARIANTS
    AtMostOneCommittable
    Agreement
