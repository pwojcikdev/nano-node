\* Partitioned network, 2 honest nodes, Byzantine weight 33 (33%), q=0.67.
\* 33 < 2*Quorum - W = 34  =>  agreement holds even under arbitrary partition.
SPECIFICATION Spec

CONSTANTS
    Blocks = {b1, b2}
    Quorum = 67
    Nodes = {n1, n2}
    InitBlock = b1
    NoBlock = none
    SyncDelivery = FALSE

CONSTANT Reps <- RepsW
CONSTANT Weight <- Weight33
CONSTANT Byzantine <- ByzZ

INVARIANTS
    TypeOK
    BarrierConsistent
    DecisionSound
    CrossNodeAgreement
