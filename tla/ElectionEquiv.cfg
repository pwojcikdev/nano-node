\* Equivocation enabled: a representative may cast FINAL votes for >1 block.
\* Expectation: TLC finds a counterexample to SafeUniqueFinal, proving the
\* persisted final_votes barrier (outside the election class) is load-bearing.
SPECIFICATION Spec

CONSTANTS
    Reps = {r1, r2, r3}
    Blocks = {b1, b2}
    Quorum = 2
    InitBlock = b1
    NoBlock = none
    AllowEquivocation = TRUE

CONSTANT Weight <- UniformWeight

INVARIANTS
    SafeUniqueFinal
