\* Non-vacuity probe on the SAFE instance: NotConfirmed-style check.
\* Expectation: NothingCommitted is VIOLATED, i.e. a commit is reachable, so
\* the clean BFTSafe result is not vacuously true.
SPECIFICATION Spec

CONSTANTS
    Blocks = {b1, b2}
    Quorum = 4
    ByzantineActive = TRUE

CONSTANT Reps <- RepsUnit
CONSTANT Weight <- WeightUnit
CONSTANT Byzantine <- ByzOne

INVARIANTS
    NothingCommitted
