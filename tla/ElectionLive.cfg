\* Reachability probe: NotConfirmed is expected to FAIL. The counterexample
\* is a trace that reaches a confirmed state, proving the safe model is not
\* vacuous (confirmation is actually achievable under the rules).
SPECIFICATION Spec

CONSTANTS
    Reps = {r1, r2, r3}
    Blocks = {b1, b2}
    Quorum = 2
    InitBlock = b1
    NoBlock = none
    AllowEquivocation = FALSE

CONSTANT Weight <- UniformWeight

INVARIANTS
    NotConfirmed
